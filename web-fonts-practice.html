<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postcard</title>

  <style>
    @font-face {
      font-family: 'journal';
      src: 
        url(fonts/journal-webfont.woff2) format("woff2"),
        url(fonts/journal-webfont.woff) format("woff");
      font-weight: normal;
      font-style: normal;
   }

    @font-face {
      font-family: 'moms-typewriter';
      src: 
        url(fonts/momt___-webfont.woff2) format("woff2"),
        url(fonts/momt___-webfont.woff) format("woff");
      font-weight: normal;
    }

    body {
      font: 1.3rem sans-serif;
      padding: 0.5em;
      background: #222222;
      margin: 0;
    }

    form {
      position: relative;
      width: 740px;
      height: 498px;
      margin: 0 auto;
      padding: 1em;
      background: white url(background.jpg);
      box-sizing: border-box;


      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 10em 1em 1em 1em;
      gap: 20px;
    }

    #message {
      grid-row: 1 / 5;
    }

  
    button {
      padding: 5px;
      font-weight: 700;
      font-size: 0.6em;
      font-family: sans-serif;
      border: 2px solid rgb(61, 58, 58);
      border-radius: 5px;
      background: none;
      color: black;
      cursor: pointer;
      transform: rotate(-1.5deg);
    }
    
    button:hover,
    button:focus {
      background-color: black;
      color: white;
    }

    input,
    textarea {
      font-size: 1.4em;
      line-height: 1.5em;
      font-family: "journal", cursive, sans-serif;
      border: none;
      padding: 0 10px;
      width: 80%;
      background: none;
      margin: 0;
    }
    
    h1 {
      font-size: 1em;
      font-family: "moms-typewriter", monospace;
      align-self: end;
    }
    
    #from,
    #reply {
      display: flex;
    }
    
    label {
      font-size: 0.8em;
      font-family: "moms-typewriter", sans-serif;
    }
    
    textarea {
      display: block;
      padding: 10px;
      margin: 10px 0 0 -10px;
      width: 100%;
      height: 90%;

      border-right: 1px solid;
      overflow: auto;
    }
    
    input:focus,
    text-area:focus {
      background-color: lightgray;
      border-radius: 5px;
    }
    
    </style>
</head>

<body>
  <form>
    <h1>to: Mozilla</h1>
    <div id="from">
      <label for="name">from:</label>
      <input type="text" id="name" name="user_name">
    </div>

    <div id="reply">
      <label for="mail">reply:</label>
      <input type="email" id="mail" name="user_email">
    </div>

    <div id="message">
      <label for="msg">Your message:</label>
      <textarea name="user_message" id="msg"></textarea>
    </div>

    <div id="send-button">
      <button type="submit">Send your message &gt;&gt;&gt;</button>
    </div>

  </form>
</body>
</html>
